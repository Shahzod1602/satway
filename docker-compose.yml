# Production / parity stack: app + Postgres.
# Local dev can instead use a host Postgres and `npm run dev`.
#
#   docker compose up -d
#
# Provide secrets via a `.env` file next to this compose file.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-satway}
    volumes:
      - satway_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satway} -d ${POSTGRES_DB:-satway}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host in production; only the app talks to it.
    expose:
      - "5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-key.json
      # AI Studio key. env.ts PREFERS this over the Vertex SA key when both are present.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      # Cost ledger + budget watchdog. AI_RATES_JSON patches the rate card without a
      # redeploy on the day an invoice proves one wrong.
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD}
      AI_USER_DAILY_ALERT_USD: ${AI_USER_DAILY_ALERT_USD}
      AI_RATES_JSON: ${AI_RATES_JSON}
      UZS_PER_USD: ${UZS_PER_USD}
      CRON_SECRET: ${CRON_SECRET}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      PAYMENT_CARD_NUMBER: ${PAYMENT_CARD_NUMBER}
      PAYMENT_CARD_HOLDER: ${PAYMENT_CARD_HOLDER}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID}
      PAYME_KEY: ${PAYME_KEY}
      PAYME_TEST_KEY: ${PAYME_TEST_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      PAYMENT_TELEGRAM: ${PAYMENT_TELEGRAM}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      # Login bot (@satwayonlinebot) — also the bot that verifies channel
      # membership for the subscription gate, so it must reach the container.
      TELEGRAM_LOGIN_BOT_TOKEN: ${TELEGRAM_LOGIN_BOT_TOKEN}
      # Subscription gate (leave blank to disable the gate).
      INSTAGRAM_URL: ${INSTAGRAM_URL}
      TELEGRAM_CHANNEL_URL: ${TELEGRAM_CHANNEL_URL}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      UPLOAD_DIR: /data/uploads
    volumes:
      # Persist admin uploads across container restarts.
      - satway_uploads:/data/uploads
      # Mount the Vertex AI service-account key read-only.
      - ${GCP_KEY_FILE:-./gemini-key.json}:/run/secrets/gcp-key.json:ro
    ports:
      - "3000:3000"

  # ── Schedulers ──────────────────────────────────────────────────────────────
  # Both are no-ops unless CRON_SECRET is set; the script exits loudly rather than
  # looping against an endpoint that will 503 forever.

  # Re-engage expired Premium. Daily is enough — the copy is the same whether it
  # arrives at 09:00 or 15:00, and more often just risks double-sending on a restart.
  cron-winback:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
      CRON_PATH: /api/cron/winback
      CRON_INTERVAL: "86400"
      CRON_JITTER: "60"
    volumes:
      - ./scripts/cron-loop.sh:/cron-loop.sh:ro
    entrypoint: ["sh", "/cron-loop.sh"]

  # One nudge to people who signed up and vanished. Daily; each user is stamped once
  # ever, so the schedule only decides how promptly it lands.
  cron-nudge:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
      CRON_PATH: /api/cron/nudge
      CRON_INTERVAL: "86400"
      CRON_JITTER: "120"
    volumes:
      - ./scripts/cron-loop.sh:/cron-loop.sh:ro
    entrypoint: ["sh", "/cron-loop.sh"]

  # Watch AI spend. Every 15 min: each alert is claimed once per (day, kind, target),
  # so a tight schedule costs nothing but catches a runaway within the quarter hour
  # instead of at the end of the month.
  cron-ai-budget:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
      CRON_PATH: /api/cron/ai-budget
      CRON_INTERVAL: "900"
      CRON_JITTER: "30"
    volumes:
      - ./scripts/cron-loop.sh:/cron-loop.sh:ro
    entrypoint: ["sh", "/cron-loop.sh"]

volumes:
  satway_db:
  satway_uploads:
